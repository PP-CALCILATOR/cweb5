<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PROBAGS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ===========================
HEADER
=========================== -->

<header class="header">

    <div class="logo">

        PROBAGS

    </div>

    <button class="menu">

        <span></span>

        <span></span>

        <span></span>

    </button>

</header>



<!-- ===========================
HERO
=========================== -->

<section class="hero" id="hero">

    <!-- Background -->

    <div class="hero-background">

        <img
        src="background.webp"
        alt=""
        class="background">

    </div>



    <!-- Content -->

    <div class="hero-content">

        <span class="hero-tag">

            PREMIUM FROSTED PP BAGS

        </span>

        <h1>

            Luxury Packaging<br>

            Crafted For Brands

        </h1>

        <p>

            Premium frosted polypropylene bags with luxury finishes,
            custom branding and handcrafted handles.

        </p>

    </div>



    <!-- Bags -->

    <div class="hero-bags">

        <img
        src="bags.webp"
        alt="Premium Bags"
        class="bags">

    </div>



    <!-- Scroll -->

    <div class="scroll">

        <span></span>

    </div>

</section>





<!-- ===========================
MATERIAL SECTION
=========================== -->

<section class="materials" id="materials">

</section>





<!-- ===========================
HANDLE SECTION
=========================== -->

<section class="handles" id="handles">

</section>





<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

<script src="https://unpkg.com/@studio-freight/lenis@1.0.42/bundled/lenis.min.js"></script>

<script src="script.js"></script>

</body>

</html>
