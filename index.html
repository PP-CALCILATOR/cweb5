<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PROBAGS | Premium Frosted PP Bags</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ==========================================
HEADER
========================================== -->

<header class="header">

    <a href="#" class="logo">

        PROBAGS

    </a>

    <button class="menu" aria-label="Menu">

        <span></span>

        <span></span>

        <span></span>

    </button>

</header>





<!-- ==========================================
HERO
========================================== -->

<section class="hero" id="hero">

    <!-- Background -->

    <div class="hero-background">

        <img
            src="background.webp"
            alt=""
            class="background">

    </div>





    <!-- Content -->

    <div class="container">

        <div class="hero-content">

            <span class="hero-tag">

                PREMIUM FROSTED PP BAGS

            </span>

            <h1 class="hero-title">

                Luxury Packaging<br>

                Crafted For Brands

            </h1>

            <p class="hero-description">

                Premium frosted polypropylene bags with luxury finishes,
                custom branding and handcrafted handles.

            </p>

        </div>

    </div>





    <!-- Bags -->

    <div class="hero-bags">

        <img
            src="bags.webp"
            alt="Premium Frosted PP Bags"
            class="bags">

    </div>





    <!-- Scroll Indicator -->

    <div class="scroll-indicator">

        <div class="mouse">

            <div class="wheel"></div>

        </div>

    </div>

</section>





<!-- ==========================================
MATERIALS
========================================== -->

<section class="materials" id="materials">

    <div class="container">

    </div>

</section>





<!-- ==========================================
HANDLES
========================================== -->

<section class="handles" id="handles">

    <div class="container">

    </div>

</section>





<!-- ==========================================
CONTACT
========================================== -->

<section class="contact" id="contact">

    <div class="container">

    </div>

</section>





<!-- ==========================================
LIBRARIES
========================================== -->

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

<script src="https://unpkg.com/@studio-freight/lenis@1.0.42/bundled/lenis.min.js"></script>





<!-- ==========================================
MAIN SCRIPT
========================================== -->

<script src="script.js"></script>

</body>

</html>
